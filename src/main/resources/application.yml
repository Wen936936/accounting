# 服务器配置
server:
  # 服务端口
  port: 8080

spring:
  # 数据源配置
  datasource:
    # MySQL 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接地址，库名 accounting_db，时区为上海
    url: jdbc:mysql://localhost:3306/accounting_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    # 数据库用户名
    username: root
    # 数据库密码
    password: Honven1223@

# JWT 鉴权配置
jwt:
  # 签名密钥，生产环境必须替换为足够长的随机字符串（HS256 至少 32 字节）
  secret: accounting-jwt-secret-key-please-change-in-production-2026
  # 令牌有效期，单位毫秒，86400000 即 24 小时
  expiration-ms: 86400000
